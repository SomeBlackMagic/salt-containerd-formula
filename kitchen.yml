verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli
    - junit:.kitchen/reports/%{suite}-%{platform}.xml

suites:
  - name: nerdctl
    includes:
      - debian-12-3008-5
    provisioner:
      pillars_from_directories:
        - test/salt/pillar/nerdctl
      dependencies:
        - name: _serializers
          path: .
      state_top:
        base:
          '*':
            - containerd
    verifier:
      inspec_tests:
        - path: test/integration/nerdctl

  - name: crictl
    includes:
      - debian-12-3008-5
    provisioner:
      pillars_from_directories:
        - test/salt/pillar/crictl
      dependencies:
        - name: _serializers
          path: .
      state_top:
        base:
          '*':
            - containerd
    verifier:
      inspec_tests:
        - path: test/integration/crictl

  - name: cni
    includes:
      - debian-12-3008-5
    provisioner:
      pillars_from_directories:
        - test/salt/pillar/cni
      state_top:
        base:
          '*':
            - containerd.cni
    verifier:
      inspec_tests:
        - path: test/integration/cni

  - name: service-enabled
    includes:
      - debian-12-3008-5
    provisioner:
      pillars_from_directories:
        - test/salt/pillar/service_enabled
      dependencies:
        - name: _serializers
          path: .
      state_top:
        base:
          '*':
            - containerd.service
            - containerd.kernel
    verifier:
      inspec_tests:
        - path: test/integration/service_enabled

  - name: preflight
    includes:
      - debian-12-3008-5
    provisioner:
      state_top:
        base:
          '*':
            - containerd._mapdata
    verifier:
      inspec_tests:
        - path: test/integration/preflight

  - name: default
    lifecycle:
      pre_converge:
        - remote: sudo mkdir -p /etc/containerd/certs.d/unmanaged.example
    provisioner:
      dependencies:
        - name: _serializers
          path: .
      state_top:
        base:
          '*':
            - containerd._mapdata
            - containerd
    verifier:
      inspec_tests:
        - path: test/integration/default

  - name: registry-purge
    includes:
      - debian-12-3008-5
    lifecycle:
      pre_converge:
        - remote: sudo mkdir -p /etc/containerd/certs.d/unmanaged.example
    provisioner:
      pillars_from_directories:
        - test/salt/pillar/registry_purge
      dependencies:
        - name: _serializers
          path: .
      state_top:
        base:
          '*':
            - containerd.config.registries
    verifier:
      inspec_tests:
        - path: test/integration/registry_purge

  - name: unit
    lifecycle:
      pre_verify:
        - remote: sudo dnf upgrade -y python3.11-libs
          includes:
            - centos-stream9-master
    provisioner:
      state_top:
        base:
          '*':
            - containerd._mapdata
      dependencies:
        - name: test
          path: .
        - name: _serializers
          path: .
    verifier:
      name: shell
      remote_exec: true
      command: >-
        set -e;
        PY="$(sudo salt-call --local --out=txt grains.get pythonexecutable
        | sed -n 's/^local: //p')";
        echo "Using Salt's Python: ${PY}";
        sudo "${PY}" -m pip --version >/dev/null 2>&1
        || sudo "${PY}" -m ensurepip --upgrade;
        sudo PIP_BREAK_SYSTEM_PACKAGES=1 "${PY}" -m pip install --quiet
        --disable-pip-version-check
        -r /tmp/kitchen/srv/salt/test/unit/requirements.txt;
        cd /tmp;
        sudo PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 "${PY}" -m pytest -p no:cacheprovider -ra
        /tmp/kitchen/srv/salt/test/unit
