# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/
driver:
  name: docker
  use_sudo: false
  privileged: true
  run_command: /usr/lib/systemd/systemd
  provision_command:
    # Workaround for RHEL-based images: SSSD is configured (via authselect) but
    # not running in containers, and /etc/shadow has 000 permissions which blocks
    # unix_chkpwd (it drops DAC_OVERRIDE). This breaks SSH and sudo for `kitchen`.
    - if [ -f /etc/nsswitch.conf ]; then sed -i '/^passwd:/s/sss //;/^group:/s/sss //' /etc/nsswitch.conf; fi
    - chmod 0640 /etc/shadow 2>/dev/null; true

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: containerd
  salt_copy_filter:
    - .kitchen
    - .git
  pillars_from_directories:
    - test/salt/pillar

transport:
  # Avoid lengthy waits when a container does not launch correctly
  max_wait_until_ready: 60

