# yamllint disable rule:indentation rule:line-length
# Default mapdata reference for all platforms.
# Create a <platform_finger>.yaml override only when a platform
# produces values that differ from this file.
---
values:
  arch: amd64
  clean:
    purge_data: false
  components:
    cni:
      checksums:
        1.9.1:
          amd64: b98f74a0f8522f0a83867178729c1aa70f2158f90c45a2ca8fa791db1c76b303
          arm64: 56171987d3947707c3563db2f4001bccaf50fd63468611b9f3cbecb1375ee7ec
      dir: /opt/cni/bin
      enabled: false
      url: https://github.com/containernetworking/plugins/releases/download/v{version}/cni-plugins-linux-{arch}-v{version}.tgz
      version: 1.9.1
    containerd:
      checksums:
        2.4.2:
          amd64: 35880c1dd4627e8ce56526bfabb39c144e83458ffdb197ce6f05d17d94d7d91e
          arm64: fdfab81a86192ddb8165d72f116ec985485c9e12505e323c4f4579c48020f276
      enabled: true
      url: https://github.com/containerd/containerd/releases/download/v{version}/containerd-{version}-linux-{arch}.tar.gz
      version: 2.4.2
    crictl:
      checksums:
        1.37.0:
          amd64: 67c983ee8a6bbce73d39a186e633c5fe4f8a70e62171ac3bd92a9c1b2c601670
          arm64: c9dfdf9ebc353a0027c88622206a5e90ee6f0e78cfabf1a9ef4dc575298fd555
      config:
        image-endpoint: unix:///run/containerd/containerd.sock
        runtime-endpoint: unix:///run/containerd/containerd.sock
      enabled: false
      url: https://github.com/kubernetes-sigs/cri-tools/releases/download/v{version}/crictl-v{version}-linux-{arch}.tar.gz
      version: 1.37.0
    nerdctl:
      checksums:
        2.4.2:
          amd64: 41a66995888043c0ba05f8061574eaba1b9e06b9b21c2a238215179df2728d3f
          arm64: 6bb9cfe435be3745c079cde6c1fd14d6515a84de2b285993d1d3e2be2c4fa36a
      config: {}
      enabled: false
      url: https://github.com/containerd/nerdctl/releases/download/v{version}/nerdctl-{version}-linux-{arch}.tar.gz
      version: 2.4.2
    runc:
      checksums:
        1.5.2:
          amd64: 599f6f94ff8c5057241eff0d54c3c74f95c34935b6457b33fe545defc61e9488
          arm64: d10ecae898361832a059be2089bab92d158aec54661b18ed7346ed79628b46b0
      enabled: true
      url: https://github.com/opencontainers/runc/releases/download/v{version}/runc.{arch}
      version: 1.5.2
  config:
    imports:
    - /etc/containerd/conf.d/*.toml
    plugins:
      io.containerd.cri.v1.images:
        registry:
          config_path: /etc/containerd/certs.d
      io.containerd.cri.v1.runtime:
        containerd:
          runtimes:
            runc:
              options:
                SystemdCgroup: true
              runtime_type: io.containerd.runc.v2
    version: 3
  config_d: {}
  conflicts:
    packages:
    - containerd
    - containerd.io
    - docker.io
    - docker-ce
    - runc
    remove: false
  keep_versions: 2
  kernel:
    enabled: false
    modules:
    - overlay
    - br_netfilter
    sysctl:
      net.bridge.bridge-nf-call-ip6tables: 1
      net.bridge.bridge-nf-call-iptables: 1
      net.ipv4.ip_forward: 1
  map_jinja:
    sources:
    - Y:G@osarch
    - Y:G@os_family
    - Y:G@os
    - Y:G@osfinger
    - C@containerd:lookup
    - C@containerd
    - Y:G@id
  paths:
    bin_dir: /usr/local/bin
    certs_dir: /etc/containerd/certs.d
    config_dir: /etc/containerd
    prefix: /opt/containerd
    sbin_dir: /usr/local/sbin
  registries: {}
  registries_purge: false
  service:
    environment: {}
    name: containerd
    overrides: {}
    restart_on_change: true
    state: running
  tofs:
    files_switch:
    - any/path/can/be/used/here
    - id
    - roles
    - osfinger
    - os
    - os_family
