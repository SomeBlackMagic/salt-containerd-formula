# yamllint disable rule:indentation rule:line-length
# AlmaLinux-8
---
values:
  arch: amd64
  config: /etc/containerd/config.toml
  map_jinja:
    sources:
    - Y:G@osarch
    - Y:G@os_family
    - Y:G@os
    - Y:G@osfinger
    - C@containerd:lookup
    - C@containerd
    - Y:G@id
  pkg:
    name: containerd
  rootgroup: root
  service:
    name: containerd
  tofs:
    files_switch:
    - any/path/can/be/used/here
    - id
    - roles
    - osfinger
    - os
    - os_family
